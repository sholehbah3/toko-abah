<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pesan Makanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #cart-modal { transition: transform 0.3s ease-in-out; }
        .cart-open { transform: translateX(0); }
        .cart-closed { transform: translateX(100%); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans relative">

    <!-- Navbar -->
    <nav class="bg-orange-600 text-white p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🍔 FoodPedia</h1>
            <button onclick="toggleCart()" class="relative bg-orange-700 hover:bg-orange-800 px-4 py-2 rounded-lg font-semibold transition">
                🛒 Keranjang
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">0</span>
            </button>
        </div>
    </nav>

    <!-- Header & Menu -->
    <header class="max-w-6xl mx-auto mt-8 px-4">
        <div class="bg-orange-100 rounded-2xl p-8 text-center border border-orange-200 shadow-sm mb-8">
            <h2 class="text-3xl font-extrabold text-orange-700 mb-2">Lapar? Pesan Sekarang!</h2>
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-4 mb-12">
        <div id="menu-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Cart Modal (Sidebar) -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden"></div>
    <div id="cart-modal" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white shadow-2xl z-50 cart-closed flex flex-col">
        <div class="p-4 bg-orange-600 text-white flex justify-between items-center">
            <h2 class="text-xl font-bold">🛒 Keranjang Belanja</h2>
            <button onclick="toggleCart()" class="text-2xl font-bold hover:text-gray-200">×</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
            <div id="empty-cart-msg" class="text-center text-gray-500 mt-10">Keranjang masih kosong</div>
        </div>
        <div class="p-4 bg-gray-100 border-t border-gray-200">
            <div class="flex justify-between font-bold text-lg mb-4">
                <span>Total:</span>
                <span id="cart-total">Rp 0</span>
            </div>
            <!-- Tombol ini sekarang membuka modal pembayaran -->
            <button onclick="openPaymentModal()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
                Proses Pembayaran
            </button>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-60 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4 border-b pb-2 text-gray-800">Pilih Metode Pembayaran</h3>
            <div class="mb-4">
                <p class="text-gray-600 text-sm">Total Tagihan:</p>
                <p id="payment-total-display" class="text-3xl font-extrabold text-orange-600">Rp 0</p>
            </div>
            
            <div class="space-y-3 mb-6 max-h-60 overflow-y-auto pr-2">
                <p class="font-bold text-sm text-gray-700 mt-2">💳 E-Wallet</p>
                <label class="flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-orange-50 transition border-gray-200 has-[:checked]:border-orange-500 has-[:checked]:bg-orange-50">
                    <input type="radio" name="payment" value="DANA" class="w-5 h-5 text-orange-600 accent-orange-600">
                    <span class="font-semibold text-gray-800">DANA</span>
                </label>
                <label
